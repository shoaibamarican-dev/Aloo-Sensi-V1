
name: ALOO SENSI PRO - FINAL APK BUILD

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: aloo-sensi-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'

      - name: Detect Project Directory
        shell: bash
        run: |
          if [ -f "AlooSensiPro/settings.gradle" ] || [ -f "AlooSensiPro/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=AlooSensiPro" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

      - name: Verify Android Project
        run: |
          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Build Debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            -p "$PROJECT_DIR" \
            clean assembleDebug

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Final Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ALOO-SENSI-PRO-DEBUG-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
